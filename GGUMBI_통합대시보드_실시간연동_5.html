<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GGUMBI F&amp;B 통합 대시보드 (실시간)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root{
    --ink:#2B1B12; --parchment:#F7F1E7; --card:#FFFFFF; --card-border:#E8DCC8;
    --muted:#8A7C6C; --amber:#B8722E; --amber-light:#E7B98A;
    --teal:#2F6F5E; --teal-light:#CFE3DC; --rust:#B23A2E; --rust-light:#F0D3CE;
    --blue:#2A5C8A; --blue-bg:#EAF1F8;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--parchment);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1240px;margin:0 auto;padding:40px 26px 80px;}
  header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;flex-wrap:wrap;gap:14px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{width:38px;height:38px;border-radius:50%;background:conic-gradient(from 220deg, var(--amber), var(--amber-light), var(--amber));display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:700;color:#fff;font-size:14px;}
  .brand-text .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;}
  .brand-text h1{font-family:'Fraunces',serif;font-weight:600;font-size:21px;margin:2px 0 0;}
  .live-chip{display:inline-flex;align-items:center;gap:6px;background:#EAF6F1;color:var(--teal);border:1px solid var(--teal-light);padding:6px 14px;border-radius:999px;font-size:12px;font-weight:600;}
  .live-chip .dot{width:6px;height:6px;border-radius:50%;background:var(--teal);animation:pulse 1.8s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

  .month-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px;}
  .month-tab{padding:9px 16px;border-radius:12px;font-size:12.8px;font-weight:600;border:1px solid var(--card-border);background:#fff;color:var(--muted);cursor:pointer;}
  .month-tab.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .month-tab.forecast::after{content:' (진행중)';font-weight:400;opacity:.7;}

  .week-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px;}
  .week-tab{padding:7px 14px;border-radius:10px;font-size:12px;font-weight:600;border:1px solid var(--card-border);background:#fff;color:var(--muted);cursor:pointer;}
  .week-tab.active{background:var(--amber);color:#fff;border-color:var(--amber);}

  .kpi-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:24px;}
  .kpi-card{background:var(--card);border:1px solid var(--card-border);border-radius:16px;padding:18px;}
  .kpi-card .k{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
  .kpi-card .v{font-family:'Fraunces',serif;font-size:22px;font-weight:600;margin:8px 0 2px;}
  .kpi-card .sub{font-size:11.5px;color:var(--muted);}

  .section-title{display:flex;align-items:baseline;gap:10px;margin:34px 0 14px;}
  .section-title h2{font-family:'Fraunces',serif;font-weight:600;font-size:19px;margin:0;}
  .section-title span{font-size:12.5px;color:var(--muted);}

  .grid-2{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;align-items:start;}
  .card{background:var(--card);border:1px solid var(--card-border);border-radius:16px;padding:22px;}
  .card h3{font-size:13.5px;margin:0 0 14px;font-weight:600;}
  .chart-box{height:270px;}

  table{width:100%;border-collapse:collapse;font-size:12.8px;}
  thead th{text-align:right;font-size:11px;text-transform:uppercase;color:var(--muted);padding:0 8px 8px;border-bottom:1px solid var(--card-border);font-weight:600;}
  thead th:first-child,thead th:nth-child(2){text-align:left;}
  tbody td{padding:9px 8px;border-bottom:1px solid #F1EADC;text-align:right;font-family:'IBM Plex Mono',monospace;font-size:12.3px;}
  tbody td:first-child,tbody td:nth-child(2){text-align:left;font-family:'Inter',sans-serif;font-weight:600;}
  tbody tr.total-row td{font-weight:700;background:#FBF6EC;}
  .neg{color:var(--rust);} .pos{color:var(--teal);}
  .table-scroll{max-height:460px;overflow-y:auto;}

  .pl-card{background:var(--blue-bg);border:1px solid #C9DCEC;border-radius:16px;padding:22px;margin-bottom:24px;}
  .pl-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr;gap:14px;align-items:end;}
  .pl-input-box .lbl{font-size:11.5px;color:var(--blue);font-weight:700;margin-bottom:6px;}
  .pl-input-box input{width:100%;border:1px solid #C9DCEC;border-radius:8px;padding:9px 10px;font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--blue);background:#fff;}
  .pl-result .k{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;}
  .pl-result .v{font-family:'Fraunces',serif;font-size:20px;font-weight:600;margin:6px 0 2px;}
  .pl-result .sub{font-size:11.5px;color:var(--muted);}

  .target-box{background:var(--card);border:1px solid var(--card-border);border-radius:16px;padding:22px 26px;margin-bottom:24px;}
  .target-box .tb-title{font-weight:700;font-size:14px;margin-bottom:14px;}
  .target-line{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;margin-bottom:8px;flex-wrap:wrap;}
  .target-line.lvl-total{background:#FBF6EC;}
  .target-line .tl-label{font-weight:700;font-size:13px;min-width:120px;}
  .target-line.lvl-sub .tl-label{font-weight:600;color:var(--amber);min-width:100px;padding-left:14px;}
  .target-line .tl-nums{font-family:'IBM Plex Mono',monospace;font-size:13px;}
  .target-line .bar-track{flex:1;min-width:140px;height:7px;background:#EFE7D8;border-radius:5px;overflow:hidden;}
  .target-line .bar-fill{height:100%;border-radius:5px;}
  .target-line .tl-rate{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:13px;padding:2px 9px;border-radius:999px;}
  .rate-good{background:var(--teal-light);color:var(--teal);}
  .rate-bad{background:var(--rust-light);color:var(--rust);}

  .controls{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:12px;flex-wrap:wrap;}
  .chan-toggle{display:flex;gap:4px;background:#F0E9DB;border-radius:10px;padding:3px;}
  .chan-toggle button{border:none;background:transparent;padding:6px 14px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;}
  .chan-toggle button.active{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08);}
  .search{border:1px solid var(--card-border);border-radius:10px;padding:8px 14px;font-size:13px;width:200px;}

  .loading{text-align:center;padding:60px 0;color:var(--muted);font-size:14px;}
  footer{margin-top:48px;padding-top:18px;border-top:1px solid var(--card-border);font-size:11.5px;color:var(--muted);}
  @media (max-width:900px){.kpi-grid{grid-template-columns:1fr 1fr;} .grid-2{grid-template-columns:1fr;} .pl-grid{grid-template-columns:1fr 1fr;}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="brand-mark">G7</div>
      <div class="brand-text">
        <div class="eyebrow">GGUMBI · F&amp;B 사업팀</div>
        <h1>통합 매출·원가·손익 대시보드</h1>
      </div>
    </div>
    <div class="live-chip"><span class="dot"></span>구글시트 실시간 연동</div>
  </header>

  <div id="loadingMsg" class="loading">데이터를 불러오는 중입니다...</div>
  <div id="mainContent" style="display:none;">

  <div class="month-tabs" id="monthTabs"></div>
  <div class="target-box" id="targetBox"></div>
  <div class="kpi-grid" id="kpiGrid"></div>

  <div class="pl-card">
    <div class="pl-grid">
      <div class="pl-input-box"><div class="lbl">변동비 (원)</div><input type="number" id="vcInput" placeholder="예: 15000000"></div>
      <div class="pl-input-box"><div class="lbl">고정비 (원)</div><input type="number" id="fcInput" placeholder="예: 35000000"></div>
      <div class="pl-result"><div class="k">매출총이익</div><div class="v" id="plGross">-</div><div class="sub" id="plGrossRate">-</div></div>
      <div class="pl-result"><div class="k">공헌이익</div><div class="v" id="plCM">입력 필요</div><div class="sub" id="plCMRate">-</div></div>
      <div class="pl-result"><div class="k">영업이익</div><div class="v" id="plOP">입력 필요</div><div class="sub" id="plOPRate">-</div></div>
    </div>
  </div>

  <div class="section-title"><h2>월별 매출 추이</h2><span>1월~7월(진행중)</span></div>
  <div class="card"><div class="chart-box" style="height:260px;"><canvas id="monthChart"></canvas></div></div>

  <div id="julySection" style="display:none;">
    <div class="section-title"><h2>7월 주차별 비교</h2><span id="weekRangeLabel"></span></div>
    <div class="week-tabs" id="weekTabs"></div>
    <div class="card">
      <div class="chart-box" style="height:440px;"><canvas id="dailyChart"></canvas></div>
    </div>

    <div class="section-title"><h2>거래처별 매출·매출이익</h2><span id="customerPeriodLabel"></span></div>
    <div class="card">
      <h3>거래처별 상세</h3>
      <div class="table-scroll">
      <table><thead><tr><th>거래처</th><th>수량</th><th>매출</th><th>매출비중</th><th>원가</th><th>매출이익</th><th>이익률</th></tr></thead><tbody id="customerBody"></tbody></table>
      </div>
    </div>

    <div class="section-title"><h2>품목별 수익성</h2><span>7월 누계</span></div>
    <div class="card">
      <div class="controls">
        <input class="search" id="itemSearch" placeholder="품목명 검색...">
      </div>
      <div class="table-scroll">
      <table><thead><tr><th>#</th><th>품목</th><th>수량</th><th>매출</th><th>원가</th><th>마진</th><th>마진율</th></tr></thead><tbody id="itemBody"></tbody></table>
      </div>
    </div>
  </div>

  <footer id="footerNote"></footer>
  </div>
</div>

<script>
// ---- Sheet sources ----
const MAIN_SHEET = '11k69kRVVp7f1C3CADD81ytG6weKpPRB1ON9FR-1_4eo';
const GID_TRANSACTIONS = '1894671080';   // 거래명세서품목조회(원본)
const GID_COST = '1259280377';           // 7월(진행중)
const GID_TARGETS = '1882406292';        // 202606(판매)ERP

const HIST_SHEET = '1qCA02HAl77VM-O7rGLMwpxkDFsj1uVpjEJEk4MTyOyQ';
const GID_HIST = '0';                    // 26년 쿠팡 채널VS쿠팡 외

function csvUrl(sheetId, gid){ return `https://docs.google.com/spreadsheets/d/${sheetId}/export?format=csv&gid=${gid}`; }

function parseCSV(text){
  const rows = [];
  let row = [], cur = '', inQ = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQ){
      if(c === '"'){ if(text[i+1] === '"'){ cur+='"'; i++; } else inQ=false; }
      else cur += c;
    } else {
      if(c === '"') inQ = true;
      else if(c === ','){ row.push(cur); cur=''; }
      else if(c === '\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
      else if(c === '\r'){}
      else cur += c;
    }
  }
  if(cur.length || row.length){ row.push(cur); rows.push(row); }
  return rows;
}
function colIdx(letters){
  let n = 0;
  for(const ch of letters) n = n*26 + (ch.charCodeAt(0) - 64);
  return n - 1; // 0-based
}
function numVal(s){
  if(s==null) return 0;
  const n = parseFloat(String(s).replace(/,/g,''));
  return isNaN(n) ? 0 : n;
}
function fmtWon(n){ return Math.round(n).toLocaleString('ko-KR')+'원'; }
function fmtM(n){ return (n/1_000_000).toLocaleString('ko-KR',{maximumFractionDigits:1}); }
function fmtNum(n){ return Math.round(n).toLocaleString('ko-KR'); }
function fmtPct(n){ return isFinite(n) ? (n*100).toFixed(1)+'%' : '-'; }

const weeks = [
  {week:'1주차', start:'2026-07-01', end:'2026-07-05'},
  {week:'2주차', start:'2026-07-06', end:'2026-07-12'},
  {week:'3주차', start:'2026-07-13', end:'2026-07-19'},
  {week:'4주차', start:'2026-07-20', end:'2026-07-26'},
  {week:'5주차', start:'2026-07-27', end:'2026-07-31'},
];
const custColors = ['#B8722E','#2F6F5E','#D9A25B','#8A7C6C','#B23A2E','#5B4636','#6E8CAB','#A66C9A'];

let selectedMonth = '2026-07';
let selectedWeek = null;
let unitCost = {};        // 품번 -> 원가단가
let txRows = [];          // {date, customer, code, name, qty, sales}
let monthly = [];         // 1~7월 {month,is_actual,sales,cost}
let targets = {weeks:[], monthly:null};

async function fetchCSV(sheetId, gid){
  const res = await fetch(csvUrl(sheetId, gid));
  if(!res.ok) throw new Error('fetch failed '+gid);
  const text = await res.text();
  return parseCSV(text);
}

async function loadAll(){
  // 1) cost lookup from 7월(진행중)
  const costRows = await fetchCSV(MAIN_SHEET, GID_COST);
  for(let r=1;r<costRows.length;r++){
    const row = costRows[r];
    const code = row[1]; // B열 품번
    const uc = numVal(row[16]); // Q열 원가단가
    if(code) unitCost[code] = uc;
  }

  // 2) transactions from 거래명세서품목조회(원본)
  const tRows = await fetchCSV(MAIN_SHEET, GID_TRANSACTIONS);
  for(let r=3;r<tRows.length;r++){ // data starts row4 (0-indexed row3)
    const row = tRows[r];
    if(!row || row.length<20) continue;
    let d = row[4]; // E열 거래명세서일
    const code = row[12]; // M열 품번
    const name = row[11]; // L열 품명
    const cust = row[8] || '미확인'; // I열 거래처
    const qty = numVal(row[16]); // Q열
    const sales = numVal(row[21]); // V열
    if(!code || !d) continue;
    d = d.slice(0,10);
    txRows.push({date:d, customer:cust, code, name, qty, sales, cost: qty*(unitCost[code]||0)});
  }

  // 3) historical monthly (1~6월) from the manus source sheet
  const hRows = await fetchCSV(HIST_SHEET, GID_HIST);
  const histByMonth = {};
  for(let r=2;r<hRows.length;r++){
    const row = hRows[r];
    if(!row || !row[0]) continue;
    const ym = row[0].trim();
    const m = ym.match(/(\d{4})년\s*(\d{1,2})월/);
    if(!m) continue;
    const key = `${m[1]}-${String(m[2]).padStart(2,'0')}`;
    if(key < '2026-01' || key > '2026-06') continue;
    const sales = numVal(row[5]);  // F열 매출액(전체)
    const cost = numVal(row[7]);   // H열 매출원가(전체)
    if(!histByMonth[key]) histByMonth[key] = {sales:0, cost:0};
    histByMonth[key].sales += sales;
    histByMonth[key].cost += cost;
  }
  for(let m=1;m<=6;m++){
    const key = `2026-${String(m).padStart(2,'0')}`;
    const d = histByMonth[key] || {sales:0,cost:0};
    monthly.push({month:key, is_actual:true, sales:d.sales, cost:d.cost});
  }
  const julySales = txRows.reduce((a,r)=>a+r.sales,0);
  const julyCost = txRows.reduce((a,r)=>a+r.cost,0);
  monthly.push({month:'2026-07', is_actual:false, sales:julySales, cost:julyCost});

  // 4) targets from 202606(판매)ERP fixed layout
  const gRows = await fetchCSV(MAIN_SHEET, GID_TARGETS);
  function cell(r, colLetters){ const row = gRows[r-1]; return row ? numVal(row[colIdx(colLetters)]) : 0; }
  const weekCols = [['AZ','BA'],['BD','BE'],['BH','BI'],['BL','BM'],['BP','BQ']];
  weeks.forEach((w,i)=>{
    const [planCol, actualCol] = weekCols[i];
    const coupangPlan = cell(9, planCol), coupangActual = cell(9, actualCol);
    const onlinePlan = cell(10, planCol), onlineActual = cell(10, actualCol);
    const totalPlan = cell(44, planCol), totalActual = cell(44, actualCol);
    targets.weeks.push({
      week: w.week,
      total:{plan:totalPlan, actual:totalActual, rate: totalPlan? totalActual/totalPlan : 0},
      online:{plan:onlinePlan, actual:onlineActual, rate: onlinePlan? onlineActual/onlinePlan : 0},
      coupang:{plan:coupangPlan, actual:coupangActual, rate: coupangPlan? coupangActual/coupangPlan : 0},
    });
  });
  targets.monthly = {
    total:{plan:cell(44,'BT'), actual:cell(44,'BU'), rate: cell(44,'BT')? cell(44,'BU')/cell(44,'BT') : 0},
    online:{plan:cell(10,'BT'), actual:cell(10,'BU'), rate: cell(10,'BT')? cell(10,'BU')/cell(10,'BT') : 0},
    coupang:{plan:cell(9,'BT'), actual:cell(9,'BU'), rate: cell(9,'BT')? cell(9,'BU')/cell(9,'BT') : 0},
  };
}

// ---------- rendering ----------
function getMonthRow(m){ return monthly.find(x=>x.month===m); }

function renderMonthTabs(){
  const wrap = document.getElementById('monthTabs');
  wrap.innerHTML = '';
  monthly.forEach(m=>{
    const b = document.createElement('button');
    b.className = 'month-tab' + (m.month===selectedMonth?' active':'') + (m.is_actual?'':' forecast');
    b.textContent = m.month;
    b.onclick = ()=>{ selectedMonth = m.month; selectedWeek=null; renderAll(); };
    wrap.appendChild(b);
  });
}

function julyPeriodDays(){
  const map = {};
  txRows.forEach(r=>{
    if(!map[r.date]) map[r.date] = {qty:0,sales:0,cost:0,by_customer:{}};
    map[r.date].qty += r.qty; map[r.date].sales += r.sales; map[r.date].cost += r.cost;
    if(!map[r.date].by_customer[r.customer]) map[r.date].by_customer[r.customer] = {qty:0,sales:0,cost:0};
    map[r.date].by_customer[r.customer].qty += r.qty;
    map[r.date].by_customer[r.customer].sales += r.sales;
    map[r.date].by_customer[r.customer].cost += r.cost;
  });
  return Object.keys(map).sort().map(d=>({date:d, ...map[d]}));
}
function getPeriodDays(){
  const days = julyPeriodDays();
  if(selectedWeek){
    const w = weeks.find(x=>x.week===selectedWeek);
    return days.filter(d=> d.date>=w.start && d.date<=w.end);
  }
  return days;
}

function renderKPI(){
  const grid = document.getElementById('kpiGrid');
  let sales, cost, qty, label;
  if(selectedMonth === '2026-07'){
    const dlist = getPeriodDays();
    sales = dlist.reduce((a,d)=>a+d.sales,0);
    cost = dlist.reduce((a,d)=>a+d.cost,0);
    qty = dlist.reduce((a,d)=>a+d.qty,0);
    label = selectedWeek || '7월 누계';
  } else {
    const m = getMonthRow(selectedMonth);
    sales = m.sales; cost = m.cost; qty = null;
    label = selectedMonth + ' 확정';
  }
  const margin = sales - cost;
  grid.innerHTML = `
    ${qty!=null ? `<div class="kpi-card"><div class="k">수량</div><div class="v">${fmtNum(qty)}</div><div class="sub">개</div></div>` : '<div class="kpi-card"><div class="k">기간</div><div class="v" style="font-size:15px;">'+label+'</div><div class="sub">월간 확정 데이터</div></div>'}
    <div class="kpi-card"><div class="k">매출</div><div class="v">${fmtM(sales)}백만</div><div class="sub">${fmtWon(sales)}</div></div>
    <div class="kpi-card"><div class="k">매출원가</div><div class="v">${fmtM(cost)}백만</div><div class="sub">${fmtWon(cost)}</div></div>
    <div class="kpi-card"><div class="k">매출총이익</div><div class="v">${fmtM(margin)}백만</div><div class="sub">${fmtWon(margin)}</div></div>
    <div class="kpi-card"><div class="k">이익률</div><div class="v">${fmtPct(margin/sales)}</div><div class="sub">${label}</div></div>
  `;
}

let manualVC=null, manualFC=null;
function renderProfitCalc(){
  let sales, cost;
  if(selectedMonth==='2026-07'){
    const dlist = getPeriodDays();
    sales = dlist.reduce((a,d)=>a+d.sales,0);
    cost = dlist.reduce((a,d)=>a+d.cost,0);
  } else {
    const m = getMonthRow(selectedMonth); sales=m.sales; cost=m.cost;
  }
  const gross = sales - cost;
  document.getElementById('plGross').textContent = fmtM(gross)+'백만';
  document.getElementById('plGrossRate').textContent = '이익률 '+fmtPct(gross/sales);
  const cmEl=document.getElementById('plCM'), cmRateEl=document.getElementById('plCMRate');
  const opEl=document.getElementById('plOP'), opRateEl=document.getElementById('plOPRate');
  if(manualVC==null){ cmEl.textContent='변동비 입력'; cmEl.style.color='var(--blue)'; cmRateEl.textContent='왼쪽에 입력하세요'; opEl.textContent='입력 필요'; opEl.style.color='var(--blue)'; opRateEl.textContent='-'; return; }
  const cm = gross - manualVC;
  cmEl.textContent = fmtM(cm)+'백만'; cmEl.style.color='var(--ink)'; cmRateEl.textContent='이익률 '+fmtPct(cm/sales);
  if(manualFC==null){ opEl.textContent='고정비 입력'; opEl.style.color='var(--blue)'; opRateEl.textContent='왼쪽에 입력하세요'; return; }
  const op = cm - manualFC;
  opEl.textContent = fmtM(op)+'백만'; opEl.style.color = op<0?'var(--rust)':'var(--ink)'; opRateEl.textContent='이익률 '+fmtPct(op/sales);
}
document.getElementById('vcInput').addEventListener('input', e=>{ manualVC = e.target.value===''?null:Number(e.target.value); renderProfitCalc(); });
document.getElementById('fcInput').addEventListener('input', e=>{ manualFC = e.target.value===''?null:Number(e.target.value); renderProfitCalc(); });

let monthChart;
function renderMonthChart(){
  const labels = monthly.map(m=>m.month);
  const salesArr = monthly.map(m=>m.sales/1_000_000);
  const colors = monthly.map(m=>m.is_actual?'#B8722E':'#8AA9C4');
  const ctx = document.getElementById('monthChart');
  if(monthChart) monthChart.destroy();
  monthChart = new Chart(ctx, { type:'bar', data:{labels, datasets:[{label:'매출(백만원)', data:salesArr, backgroundColor:colors, borderRadius:5, maxBarThickness:44}]},
    options:{plugins:{legend:{display:false}}, scales:{y:{grid:{color:'#F0E9DB'}}, x:{grid:{display:false}}}} });
}

function targetLine(label, plan, actual, rate, lvl){
  const good = rate>=0.6; const pct = Math.min(rate,1)*100;
  const barColor = rate>=0.8?'#2F6F5E':(rate>=0.4?'#B8722E':'#B23A2E');
  return `<div class="target-line ${lvl==='total'?'lvl-total':'lvl-sub'}">
    <div class="tl-label">${label}</div>
    <div class="tl-nums"><b>${fmtWon(plan)}</b> / ${fmtWon(actual)}</div>
    <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${barColor}"></div></div>
    <div class="tl-rate ${good?'rate-good':'rate-bad'}">${(rate*100).toFixed(1)}%</div>
  </div>`;
}
function renderTargetBox(){
  const box = document.getElementById('targetBox');
  if(selectedMonth !== '2026-07'){ box.innerHTML = `<div class="tb-title">${selectedMonth} 확정 실적</div><div style="font-size:12px;color:var(--muted)">이 월은 목표(Plan) 데이터가 없어 실적만 표시합니다.</div>`; return; }
  let t, title;
  if(selectedWeek){ t = targets.weeks.find(w=>w.week===selectedWeek); title = `7월 ${selectedWeek} 목표 대비 실적`; }
  else { t = targets.monthly; title = '7월 월간 목표 대비 실적'; }
  box.innerHTML = `<div class="tb-title">${title}<span style="font-weight:400;font-size:11.5px;color:var(--muted);margin-left:6px;">(VAT별도, 202606(판매)ERP 시트 실시간 연동)</span></div>
    ${targetLine('매출목표', t.total.plan, t.total.actual, t.total.rate, 'total')}
    ${targetLine('G7 온라인', t.online.plan, t.online.actual, t.online.rate, 'sub')}
    ${targetLine('G7 쿠팡', t.coupang.plan, t.coupang.actual, t.coupang.rate, 'sub')}`;
}

function renderWeekTabs(){
  const wrap = document.getElementById('weekTabs');
  wrap.innerHTML = '';
  const allBtn = document.createElement('button');
  allBtn.className = 'week-tab' + (selectedWeek===null?' active':'');
  allBtn.textContent = '전체(7월)';
  allBtn.onclick = ()=>{ selectedWeek=null; renderAll(); };
  wrap.appendChild(allBtn);
  weeks.forEach(w=>{
    const b = document.createElement('button');
    b.className = 'week-tab' + (w.week===selectedWeek?' active':'');
    b.textContent = w.week;
    b.onclick = ()=>{ selectedWeek=w.week; renderAll(); };
    wrap.appendChild(b);
  });
  document.getElementById('weekRangeLabel').textContent = selectedWeek ? (weeks.find(w=>w.week===selectedWeek).start+'~'+weeks.find(w=>w.week===selectedWeek).end) : '2026-07-01~28';
}

let dailyChart;
function renderDaily(){
  const dlist = getPeriodDays();
  const labels = dlist.map(d=>d.date.slice(5));
  const salesArr = dlist.map(d=>d.sales/1_000_000);
  const marginArr = dlist.map(d=>(d.sales-d.cost)/1_000_000);
  const ctx = document.getElementById('dailyChart');
  if(dailyChart) dailyChart.destroy();
  dailyChart = new Chart(ctx, {type:'bar', data:{labels, datasets:[
    {label:'매출(백만원)', data:salesArr, backgroundColor:'#B8722E', borderRadius:4, maxBarThickness:34},
    {label:'매출이익(백만원)', data:marginArr, backgroundColor:'#2F6F5E', borderRadius:4, maxBarThickness:34}
  ]}, options:{
    maintainAspectRatio:false,
    plugins:{legend:{position:'bottom', labels:{font:{size:13}}}},
    scales:{
      y:{grid:{color:'#F0E9DB'}, ticks:{font:{size:12}}},
      x:{grid:{display:false}, ticks:{font:{size:11.5}, maxRotation:60, minRotation:45}}
    }
  }});
}

function renderCustomers(){
  const dlist = getPeriodDays();
  const agg = {};
  dlist.forEach(d=>{
    Object.entries(d.by_customer).forEach(([c,v])=>{
      if(!agg[c]) agg[c] = {qty:0,sales:0,cost:0};
      agg[c].qty+=v.qty; agg[c].sales+=v.sales; agg[c].cost+=v.cost;
    });
  });
  const rows = Object.entries(agg).map(([c,v])=>({c,...v,margin:v.sales-v.cost,rate:v.sales?(v.sales-v.cost)/v.sales:0})).filter(r=>r.sales>0).sort((a,b)=>b.sales-a.sales);
  document.getElementById('customerPeriodLabel').textContent = selectedWeek || '7월 누계';
  const body = document.getElementById('customerBody');
  const totS=rows.reduce((a,r)=>a+r.sales,0), totC=rows.reduce((a,r)=>a+r.cost,0), totQ=rows.reduce((a,r)=>a+r.qty,0);
  body.innerHTML = rows.map(r=>`<tr><td>${r.c}</td><td>${fmtNum(r.qty)}</td><td>${fmtWon(r.sales)}</td><td>${fmtPct(totS? r.sales/totS : 0)}</td><td>${fmtWon(r.cost)}</td><td>${fmtWon(r.margin)}</td><td class="${r.rate<0.2?'neg':'pos'}">${fmtPct(r.rate)}</td></tr>`).join('');
  body.innerHTML += `<tr class="total-row"><td>합계 (${rows.length}개)</td><td>${fmtNum(totQ)}</td><td>${fmtWon(totS)}</td><td>100.0%</td><td>${fmtWon(totC)}</td><td>${fmtWon(totS-totC)}</td><td>${fmtPct((totS-totC)/totS)}</td></tr>`;
}

function renderItems(){
  const filter = document.getElementById('itemSearch').value.toLowerCase();
  const agg = {};
  txRows.forEach(r=>{
    if(!agg[r.code]) agg[r.code] = {name:r.name, qty:0, sales:0, cost:0};
    agg[r.code].qty+=r.qty; agg[r.code].sales+=r.sales; agg[r.code].cost+=r.cost;
  });
  const rows = Object.values(agg).filter(it=>it.name.toLowerCase().includes(filter)).sort((a,b)=>b.sales-a.sales);
  const body = document.getElementById('itemBody');
  body.innerHTML = rows.map((it,i)=>{
    const margin = it.sales-it.cost, rate = it.sales?margin/it.sales:0;
    return `<tr><td>${i+1}</td><td>${it.name}</td><td>${fmtNum(it.qty)}</td><td>${fmtWon(it.sales)}</td><td>${fmtWon(it.cost)}</td><td>${fmtWon(margin)}</td><td class="${rate<0?'neg':'pos'}">${fmtPct(rate)}</td></tr>`;
  }).join('');
}
document.getElementById('itemSearch').addEventListener('input', renderItems);

function renderAll(){
  renderMonthTabs();
  renderTargetBox();
  renderKPI();
  renderProfitCalc();
  document.getElementById('julySection').style.display = selectedMonth==='2026-07' ? 'block' : 'none';
  if(selectedMonth==='2026-07'){
    renderWeekTabs();
    renderDaily();
    renderCustomers();
    renderItems();
  }
}

(async function init(){
  try{
    await loadAll();
    renderMonthChart();
    renderAll();
    document.getElementById('footerNote').textContent = '데이터 출처: 거래명세서품목조회(원본)·7월(진행중)·202606(판매)ERP (GGUMBI F&B 원가관리 통합 데이터 시트), 26년 쿠팡 채널VS쿠팡 외 (F&B 마누스 로우데이터 시트) — 모두 구글시트에서 실시간 fetch';
    document.getElementById('loadingMsg').style.display='none';
    document.getElementById('mainContent').style.display='block';
  }catch(e){
    document.getElementById('loadingMsg').textContent = '데이터를 불러오지 못했습니다: ' + e.message + ' (구글시트가 "링크가 있는 모든 사용자" 공개 상태인지 확인해주세요)';
  }
})();
</script>
